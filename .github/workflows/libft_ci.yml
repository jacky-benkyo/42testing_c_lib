name: Libft CI/CD Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. make sure build-essential and valgrind are installed
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      # 3. Test Makefile rules (all, clean, fclean, re)
      - name: Test Makefile Rules
        run: |
          echo "=== Testing make all ==="
          make all
          test -f libft.a || (echo "libft.a was not created!" && exit 1)

          echo "=== Testing make clean ==="
          make clean
          test ! -f ft_strlen.o || (echo "Object files still exist!" && exit 1)

          echo "=== Testing make re ==="
          make re
          test -f libft.a || (echo "libft.a missing after make re!" && exit 1)

      # 4. Compile test.c and link with libft.a
      - name: Compile Unit Tests
        run: |
          cc -Wall -Wextra -Werror test.c -L. -lft -o tester

      # 5. Run Test Suite
      - name: Run Test Suite
        run: |
          ./tester

      # 6. (Optional) use Valgrind to check Memory Leaks
      - name: Check Memory Leaks with Valgrind
        run: |
          valgrind --leak-check=full --error-exitcode=42 ./tester