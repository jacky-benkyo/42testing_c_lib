name: Libft CI/CD Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. make sure build-essential and valgrind are installed
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      # 3. Compile test.c and link with libft.a
      - name: Compile Unit Tests
        run: |
          cc -Wall -Wextra -Werror test.c -L. -lft -o tester

      # 4. Run Test Suite
      - name: Run Test Suite
        run: |
          ./tester

      # 5. (Optional) use Valgrind to check Memory Leaks
      - name: Check Memory Leaks with Valgrind
        run: |
          valgrind --leak-check=full --error-exitcode=42 ./tester